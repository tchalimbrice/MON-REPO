server:
  port: 8094

spring:
  application:
    name: service-template
  datasource:
    url: jdbc:postgresql://localhost:5432/template_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:e939241a90303f}
    password: ${SPRING_MAIL_PASSWORD:f2088af0acc8ac}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

service:
  base-path: /api
  domain: template

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}

jwt:
  secret: changeme1234567890changeme1234567890
  expiration: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

mail:
  from: ${MAIL_FROM:no-reply@bizmaster.local}
